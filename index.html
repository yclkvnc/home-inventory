<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Inventory</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">Home Inventory</h1>
    <div class="account">
      <button id="theme-toggle-btn" type="button" class="btn btn-icon" aria-pressed="false" aria-label="Switch to dark theme" title="Switch to dark theme">
        <span id="theme-toggle-icon" aria-hidden="true">☾</span>
      </button>
      <span id="user-name" class="user-name" hidden></span>
      <button id="signin-btn" type="button" class="btn btn-primary" hidden>Sign in with Microsoft</button>
      <button id="signout-btn" type="button" class="btn" hidden>Sign out</button>
    </div>
  </header>

  <main class="content">
    <p id="status" class="status" role="status" aria-live="polite">Loading…</p>

    <section id="toolbar" class="toolbar" hidden>
      <div class="toolbar-search">
        <input id="search" type="search" class="input" placeholder="Search name, category, room, notes…" aria-label="Search items">
      </div>

      <div class="toolbar-group" role="group" aria-label="Filters">
        <div class="filters">
          <button id="filters-btn" type="button" class="btn filters-btn" aria-expanded="false" aria-controls="filters-panel">
            Filters
            <span id="filters-count" class="badge" hidden>0</span>
          </button>
          <div id="filters-panel" class="filters-panel" hidden>
            <div class="filters-panel-head">
              <span class="filters-panel-title">Filters</span>
              <button id="clear-filters-btn" type="button" class="btn btn-small" disabled>Clear all filters</button>
            </div>
            <label class="filters-field" for="filter-category">
              <span class="filters-field-label">Category</span>
              <select id="filter-category" class="input" aria-label="Filter by category"></select>
            </label>
            <label class="filters-field" for="filter-room">
              <span class="filters-field-label">Room</span>
              <select id="filter-room" class="input" aria-label="Filter by room"></select>
            </label>
            <div id="tag-filter" class="tag-filter" role="group" aria-label="Filter by tags" hidden>
              <span class="tag-filter-label">Tags</span>
              <div id="tag-filter-list" class="tags"></div>
              <button id="clear-tags-btn" type="button" class="btn btn-small" hidden>Clear tags</button>
            </div>
          </div>
        </div>
      </div>

      <div class="toolbar-group" role="group" aria-label="Sorting">
        <select id="sort-field" class="input" aria-label="Sort by">
          <option value="Name">Sort: Name</option>
          <option value="CreatedAt">Sort: CreatedAt</option>
          <option value="UpdatedAt">Sort: UpdatedAt</option>
        </select>
        <button id="sort-direction-btn" type="button" class="btn btn-icon" aria-label="Sort direction: descending">
          <span id="sort-direction-icon" aria-hidden="true">↓</span>
        </button>
      </div>

      <div class="toolbar-group toolbar-actions" role="group" aria-label="Actions">
        <button id="add-btn" type="button" class="btn btn-primary">Add Item</button>
        <button id="refresh-btn" type="button" class="btn">Refresh</button>
      </div>
    </section>

    <div id="list-header" class="list-header" hidden>
      <h2 class="list-title">Items</h2>
      <div class="list-actions">
        <button id="expand-all-btn" type="button" class="btn btn-small">Expand all</button>
        <button id="collapse-all-btn" type="button" class="btn btn-small">Collapse all</button>
      </div>
    </div>

    <section id="items" class="items" hidden></section>
    <p id="empty" class="empty" hidden>No items match your search.</p>
  </main>

  <dialog id="item-dialog" class="dialog">
    <form id="item-form" method="dialog">
      <h2 id="dialog-title">Add Item</h2>
      <div class="form-row">
        <label for="photo-input">Photo</label>
        <div id="photo-preview" hidden>
          <img id="photo-thumb" class="dialog-thumb" alt="Current photo">
          <button type="button" id="remove-photo-btn" class="btn btn-danger">Remove photo</button>
        </div>
        <input id="photo-input" type="file" accept="image/*">
        <p id="photo-current" class="hint" hidden></p>
      </div>
      <div id="form-fields" class="form-fields"></div>
      <div id="form-error" class="error" role="alert" hidden>
        <span id="form-error-text"></span>
        <button type="button" id="retry-btn" class="btn btn-small" hidden>Retry</button>
        <button type="button" id="dismiss-error-btn" class="btn btn-small">Dismiss</button>
      </div>
      <menu class="dialog-actions">
        <button type="button" id="cancel-btn" class="btn">Cancel</button>
        <button type="submit" id="save-btn" class="btn btn-primary">
          <span id="save-spinner" class="spinner" hidden aria-hidden="true"></span>
          <span id="save-label">Save</span>
        </button>
      </menu>
    </form>
  </dialog>

  <dialog id="photo-dialog" class="dialog photo-dialog">
    <img id="photo-full" alt="Item photo">
    <menu class="dialog-actions">
      <button type="button" id="photo-close-btn" class="btn">Close</button>
    </menu>
  </dialog>

  <div class="toasts">
    <div id="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>

  <!-- MSAL.js v2, vendored locally (no npm / no build step / no third-party CDN). -->
  <script src="vendor/msal-browser.min.js"
          onerror="(function(){var s=document.getElementById('status');s.textContent='The Microsoft sign-in library (MSAL) could not be loaded. Check your network or ad blocker.';s.className='status error';s.hidden=false;})()"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
